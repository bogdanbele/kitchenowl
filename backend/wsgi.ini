[uwsgi]
strict = true
master = true
enable-threads = true
http-websockets = true
lazy-apps=true
vacuum = true
single-interpreter = true
die-on-term = true
need-app = true
chmod-socket = 664

wsgi-file = wsgi.py
callable = app
socket = [::]:5000
procname-prefix-spaced = kitchenowl

[celery]
ini = :uwsgi
smart-attach-daemon = /tmp/celery.pid celery -A app.celery_app worker -B --pidfile=/tmp/celery.pid

[web]
ini = :uwsgi
http = [::]:8080
http-keepalive = 1
http-to = :5000
static-map = /next=/var/www/web/next
static-map = /=/var/www/web/kitchenowl
# Deep links into the React client, e.g. /next/household/1/shopping. The
# extension test is what keeps this from swallowing /next/assets/app.js, the
# same trick the Flutter fallback below uses.
route = ^\/next(?!.*\.)[^\.]*$ static:/var/www/web/next/index.html
route = ^\/(?!api)(?!mcp)(?!next)[^\.]*$ static:/var/www/web/kitchenowl/index.html
