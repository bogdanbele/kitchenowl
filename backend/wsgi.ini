[uwsgi]
strict = true
master = true
enable-threads = true
http-websockets = true
lazy-apps=true
vacuum = true
single-interpreter = true
die-on-term = true
need-app = true
chmod-socket = 664

wsgi-file = wsgi.py
callable = app
socket = [::]:5000
procname-prefix-spaced = kitchenowl

[celery]
ini = :uwsgi
smart-attach-daemon = /tmp/celery.pid celery -A app.celery_app worker -B --pidfile=/tmp/celery.pid

[web]
ini = :uwsgi
http = [::]:8080
http-keepalive = 1
http-to = :5000
static-map = /=/var/www/web/app
# Links shared while the client lived at /next keep working, and keep their
# path: /next/household/1/recipes was sent to somebody as a recipe, so landing
# them on the shopping list is only half a redirect.
route = ^/next$ redirect-permanent:/
route = ^/next/(.*)$ redirect-permanent:/$1
# Deep links, e.g. /household/1/shopping. The extension test is what stops this
# swallowing /assets/app.js — a path with a dot is a file, not a route.
route = ^\/(?!api)(?!mcp)[^\.]*$ static:/var/www/web/app/index.html
# The HTML document is never cached; the hashed assets it points at are cached
# hard, because their names change when their contents do.
#
# This has to be a *response* route matched on content type. The earlier attempt
# matched the request path ^/index\.html$ — a path this app never serves, since
# the document comes back from / and from every deep link — so no header was set
# at all, and a browser holding yesterday's index.html asked for chunk names
# that no longer existed. That is the "Failed to fetch dynamically imported
# module" crash, and it is not fixed by reloading, because the reload is served
# from the same stale cache.
# Matched on the URI, not the response content type: ${HTTP_CONTENT_TYPE} is the
# *request's* header and is empty on a GET, so that matched nothing. A path with
# no dot in it is the document — the same test the SPA fallback above uses.
response-route-uri = ^/(?!api)(?!mcp)[^\.]*$ addheader:Cache-Control: no-cache
response-route-uri = ^/assets/ addheader:Cache-Control: public, max-age=31536000, immutable
